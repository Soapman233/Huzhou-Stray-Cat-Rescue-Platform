server:
  port: 8080

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hzsca}?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 如果有密码，请在这里设置
      database: 0
      timeout: 5000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  # Jackson 配置（必须位于 spring 下才会生效）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # 允许循环引用（必须位于 spring.main 下才会生效）
  main:
    allow-circular-references: true

# 配置mybatis实体和xml映射
mybatis:
  ## 映射xml
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 配置日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 关闭驼峰命名转换，因为我们使用大写开头的属性名
    map-underscore-to-camel-case: false

# 文件上传路径配置
file:
  upload:
    path: uploads

# Springdoc-OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hzsca.controller

security:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: hzsca
    expire-seconds: 604800

wechat:
  miniapp:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}

# 支付宝（沙箱）配置
# enabled=false 或密钥为空时，支付模块自动降级为 Mock 演示模式，无需真实账号即可演示完整支付流程
alipay:
  enabled: ${ALIPAY_ENABLED:false}
  # 沙箱网关（新版）；若使用旧版沙箱可改为 https://openapi.alipaydev.com/gateway.do
  gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  app-id: ${ALIPAY_APP_ID:}
  # 商户应用私钥（PKCS#8，Base64，可含 PEM 头尾或换行）
  merchant-private-key: ${ALIPAY_PRIVATE_KEY:}
  # 支付宝公钥（用于异步通知验签）
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/payment/alipay/notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/hzsca/donate/result}
  sign-type: RSA2
  charset: UTF-8
  # 单笔金额上下限（单位：分），默认 1 元 ~ 50000 元
  min-amount: 100
  max-amount: 5000000
